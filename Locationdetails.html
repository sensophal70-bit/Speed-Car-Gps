<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ស្វែងរកទីតាំងតាម GPS</title>
    <!-- ប្រើប្រាស់ Google Font ភាសាខ្មែរ -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            font-family: inherit;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef6ff;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            display: none;
        }
        .result-item {
            margin-bottom: 8px;
            color: #2c3e50;
            line-height: 1.5;
        }
        .result-item strong {
            color: #000;
        }
        .loading {
            text-align: center;
            color: #666;
            display: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ស្វែងរកទីតាំងតាម GPS</h2>
    
    <div class="input-group">
        <label for="coords">បញ្ចូលកូអរដោនេ (Lat, Lon):</label>
        <input type="text" id="coords" placeholder="ឧទាហរណ៍: 11.5564, 104.9282">
    </div>
    
    <button onclick="getLocation()">ស្វែងរកទីតាំង</button>

    <div id="loading" class="loading">កំពុងស្វែងរកទិន្នន័យ...</div>

    <div id="result" class="result-box">
        <div class="result-item"><strong>ភូមិ:</strong> <span id="village">-</span></div>
        <div class="result-item"><strong>ឃុំ / សង្កាត់:</strong> <span id="commune">-</span></div>
        <div class="result-item"><strong>ស្រុក / ខណ្ឌ:</strong> <span id="district">-</span></div>
        <div class="result-item"><strong>ខេត្ត / រាជធានី:</strong> <span id="province">-</span></div>
        <hr style="border: 0.5px solid #ddd; margin: 10px 0;">
        <div class="result-item"><strong>អាសយដ្ឋានពេញ:</strong> <br><span id="fullAddress">-</span></div>
    </div>
</div>

<script>
async function getLocation() {
    const coordsInput = document.getElementById('coords').value.trim();
    const resultBox = document.getElementById('result');
    const loading = document.getElementById('loading');

    if (!coordsInput) {
        alert('សូមបញ្ចូលកូអរដោនេ GPS!');
        return;
    }

    // បំបែកអត្ថបទដោយប្រើសញ្ញាក្បៀស (,) ឬដកឃ្លា (space)
    const coordsArr = coordsInput.split(/[\s,]+/);

    if (coordsArr.length < 2 || !coordsArr[0] || !coordsArr[1]) {
        alert('ទម្រង់កូអរដោនេមិនត្រឹមត្រូវ! សូមបញ្ចូលតាមទម្រង់: 11.5564, 104.9282');
        return;
    }

    const lat = coordsArr[0];
    const lon = coordsArr[1];

    loading.style.display = 'block';
    resultBox.style.display = 'none';

    // ហៅ API ដោយកំណត់ភាសាជាខ្មែរ (accept-language=km)
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=km`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        loading.style.display = 'none';

        if (data.error) {
            alert('រកមិនឃើញទីតាំងសម្រាប់កូអរដោនេនេះទេ!');
            return;
        }

        const addr = data.address || {};

        // បង្ហាញទិន្នន័យតាមជួរ
        document.getElementById('village').innerText = addr.village || addr.hamlet || addr.neighbourhood || 'មិនមានទិន្នន័យ';
        document.getElementById('commune').innerText = addr.suburb || addr.quarter || addr.commune || addr.township || 'មិនមានទិន្នន័យ';
        document.getElementById('district').innerText = addr.district || addr.city_district || addr.county || 'មិនមានទិន្នន័យ';
        document.getElementById('province').innerText = addr.state || addr.province || addr.city || 'មិនមានទិន្នន័យ';
        document.getElementById('fullAddress').innerText = data.display_name || '-';

        resultBox.style.display = 'block';

    } catch (error) {
        loading.style.display = 'none';
        alert('មានបញ្ហាក្នុងការតភ្ជាប់ សូមព្យាយាមម្តងទៀត!');
    }
}
</script>

</body>
</html>
